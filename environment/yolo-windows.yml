# Native Windows reconstruction of the isolated detector process environment.
# Source anchor: Python 3.10.20, torch 2.11.0+cu128, torchvision
# 0.26.0+cu128, ultralytics 8.4.100. Exact Windows wheel availability and
# driver compatibility must be verified on the target machine.
name: osdtrack-yolo
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy==2.2.6
      - opencv-python==5.0.0.93
      - ultralytics==8.4.100
      - ultralytics-thop==2.1.0
      - scipy==1.15.3
      - matplotlib==3.10.9
      - pandas==2.3.3
      - Pillow==12.2.0
      - PyYAML==6.0.3
      - requests==2.34.2
      - psutil==7.2.2
      - polars==1.43.1
