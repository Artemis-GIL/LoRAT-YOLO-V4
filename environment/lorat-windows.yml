# Native Windows reconstruction of the LoRAT process environment.
# Source anchor: Python 3.10.21, torch 2.7.1+cu128, torchvision 0.22.1+cu128.
# Conda's exact Python build is platform-specific; verify this candidate on the
# target Windows/NVIDIA machine with scripts/verify_windows.ps1.
name: osdtrack-lorat
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128
      - numpy==1.26.4
      - opencv-python==4.10.0.84
      - safetensors==0.8.0
      - scipy==1.10.1
      - timm==1.0.19
      - einops==0.8.2
      - PyYAML==6.0.2
      - tqdm==4.66.3
      - matplotlib==3.7.5
      - pandas==2.3.3
      - Pillow==12.3.0
      - psutil==7.2.2
      - shapely==2.0.7
      - easydict==1.13
      - pytest==8.3.5
